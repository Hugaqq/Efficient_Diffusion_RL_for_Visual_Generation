run_name: world_r1_real_wan_one_step
seed: 1401
use_lora: true

model:
  name: world_r1_wan_legacy
  model_path: /tmp/v-qiaoqifan/models/Wan2.1-T2V-1.3B-Diffusers
  model_family: wan
  extra:
    wan_backend: world_r1
    world_r1_root: /tmp/v-qiaoqifan/reference/World-R1-main
    device: cuda
    dtype: bfloat16
    local_files_only: true
    low_cpu_mem_usage: true
    train_cfg: false
    lora_rank: 16
    lora_alpha: 32
    gradient_checkpointing: true

dataset:
  prompts:
    - "a vivid red cube slowly rotating on a white table"
  repeat_per_prompt: 1

sample:
  name: full_trajectory
  batch_size: 1
  num_steps: 2
  guidance_scale: 1.0
  samples_per_prompt: 2
  kl_reward: 0.0
  noise_level: 0.7

rollout:
  frames: 5
  height: 64
  width: 64
  max_sequence_length: 128
  train_cfg: false

algorithm:
  name: grpo
  clip_range: 0.001
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo
  advantage_epsilon: 0.000001
  advantage_dtype: float32
  credit_assignment: all

rewards:
  weights:
    prompt_color: 1.0
  clients:
    prompt_color:
      name: prompt_color
      version: v1
  fail_policy: raise

train:
  learning_rate: 0.0001
  max_grad_norm: 1.0
  max_steps: 1
  save_every: 1

runner:
  strict_rollout_validation: true
  disable_rollout_cache: true
  show_progress: true
  deterministic_run_dir: true

paths:
  output_dir: /tmp/v-qiaoqifan/runs/wan_world_r1_real_one_step_20260714
