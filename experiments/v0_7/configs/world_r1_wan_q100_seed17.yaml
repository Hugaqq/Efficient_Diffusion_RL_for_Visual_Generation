schema_version: 1

run:
  seed: 17

model:
  name: wan_world_r1
  adapter_checkpoint: null
  params:
    checkpoint: ../../../checkpoints/Wan2.1-T2V-1.3B-Diffusers
    lora_rank: 32
    lora_alpha: 64
    lora_target_modules: [to_q, to_k, to_v, to_out.0]
    gradient_checkpointing: true
    guidance_scale: 5.0
    height: 480
    width: 832
    max_sequence_length: 226
    local_files_only: true
    low_cpu_mem_usage: true
    offload_frozen_modules_during_update: true
    vae_tiling: true

dataset:
  path: null
  prompts:
    - "A quiet stone courtyard, camera push in."
    - "A red sculpture on a pedestal, camera orbit right."
  split: train
  repeat_per_prompt: 1
  require_unique: true
  sampling_strategy: sequential
  sampling_seed: 31
  empty_prompt_policy: error

rollout:
  name: full_trajectory
  params:
    num_steps: 10
    samples_per_prompt: 2

reward:
  components:
    - name: reward_general
      weight: 1.0
      params:
        url: http://127.0.0.1:8090
        timeout_s: 1830.0
        trusted_hosts: [127.0.0.1]
        ca_bundle: null
        max_response_bytes: 8388608
        server_revision: world-r1-e156b02bc171
    - name: reward_3d
      weight: 1.0
      params:
        url: http://127.0.0.1:8089
        timeout_s: 1830.0
        trusted_hosts: [127.0.0.1]
        ca_bundle: null
        max_response_bytes: 8388608
        server_revision: world-r1-e156b02bc171
  execution:
    microbatch_size: 2
    max_retries: 1
  cache_dir: ../reward_cache/world-r1-wan

algorithm:
  name: grpo
  params:
    clip_range: 0.001
    adv_clip_max: 5.0
    beta: 0.0
  advantage:
    epsilon: 1.0e-6

optimizer:
  learning_rate: 3.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  max_initial_logprob_delta: 1.0e-4
  require_initial_clipfrac_zero: true
  require_finite_gradients: true
  require_nonzero_gradients: true

runtime:
  max_steps: 100
  batch_size: 1
  precision: bf16
  update_microbatch_size: 2
  transition_microbatch_size: 1
  deterministic: true
  progress: true
  distributed:
    mode: single
    device: cuda
    timeout_s: 300.0
    max_snapshot_tensor_bytes: null

artifacts:
  output_dir: ../runs/world_r1_wan_q100_seed17
  checkpoint_every: 10
  checkpoint_keep_last: 1
  preview_samples_per_event: 2

resume:
  from: null
