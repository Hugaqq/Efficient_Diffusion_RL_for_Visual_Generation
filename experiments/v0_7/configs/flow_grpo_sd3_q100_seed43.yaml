schema_version: 1

run:
  seed: 43

model:
  name: sd3_tempflow
  adapter_checkpoint: null
  params:
    checkpoint: ../../../checkpoints/stable-diffusion-3.5-medium
    lora_rank: 32
    lora_alpha: 64
    lora_target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v
    gradient_checkpointing: true
    guidance_scale: 4.5
    resolution: 512
    max_sequence_length: 128
    local_files_only: true
    low_cpu_mem_usage: true
    offload_frozen_modules_during_update: true
    policy_forward_microbatch_size: 1

dataset:
  path: ../../../data/prompts/geneval_rgb_train_36.txt
  prompts: null
  split: train
  repeat_per_prompt: 1
  require_unique: true
  sampling_strategy: sequential
  sampling_seed: 41
  empty_prompt_policy: error

rollout:
  name: full_trajectory
  params:
    num_steps: 20
    samples_per_prompt: 8

reward:
  components:
    - name: prompt_color_guarded
      weight: 1.0
      params:
        default_color: red
        margin_clip: 0.5
        saturation_max: 0.95
        luminance_min: 0.05
        luminance_max: 0.95
        spatial_std_min: 0.01
        spatial_std_max: 0.5
        saturation_penalty_weight: 1.0
        luminance_penalty_weight: 1.0
        spatial_penalty_weight: 1.0
  execution:
    microbatch_size: 8
    max_retries: 0
  cache_dir: ../reward_cache/flow-grpo-sd3

algorithm:
  name: grpo
  params:
    clip_range: 0.001
    adv_clip_max: 5.0
    beta: 0.004
  advantage:
    epsilon: 1.0e-4

optimizer:
  learning_rate: 3.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  max_initial_logprob_delta: 1.0e-4
  require_initial_clipfrac_zero: true
  require_finite_gradients: true
  require_nonzero_gradients: true

runtime:
  max_steps: 100
  batch_size: 1
  precision: bf16
  update_microbatch_size: 8
  transition_microbatch_size: 1
  deterministic: true
  progress: true
  distributed:
    mode: single
    device: cuda
    timeout_s: 300.0
    max_snapshot_tensor_bytes: null

artifacts:
  output_dir: ../runs/flow_grpo_sd3_q100_seed43
  checkpoint_every: 10
  checkpoint_keep_last: 1
  preview_samples_per_event: 2

resume:
  from: null
