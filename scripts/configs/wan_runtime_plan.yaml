run_name: wan_runtime_plan
seed: 42
paths:
  output_dir: runs/wan_runtime_plan

model:
  name: world_r1_wan_legacy
  model_family: wan
  model_path: ""
  extra:
    world_r1_root: reference_code/World-R1-main

dataset:
  prompts:
    - "a cinematic camera move through a clean indoor scene"
    - "a wide shot of a robot walking across a small workshop"
  repeat_per_prompt: 1

sample:
  name: full_trajectory
  batch_size: 1
  num_steps: 2
  samples_per_prompt: 2
  noise_level: 0.7
  sde_window_size: 1
  sde_window_range: [0, 2]

algorithm:
  name: grpo
  clip_range: 0.001
  beta: 0.0
  advantage_mode: grpo
  weight_advantages: false

rewards:
  weights:
    mock: 1.0
  clients:
    mock:
      name: mock
      version: v1
  fail_policy: invalid

train:
  learning_rate: 1.0e-4
  max_steps: 1
  save_every: 1
