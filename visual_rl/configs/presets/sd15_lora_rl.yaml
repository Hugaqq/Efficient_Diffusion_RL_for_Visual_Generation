run_name: sd15_lora_rl
seed: 17
output_dir: runs/sd15_lora_rl
use_lora: true

model:
  name: sd15_lora
  model_family: image
  model_path: ""
  extra:
    resolution: 256
    dtype: float16
    lora_rank: 4
    lora_alpha: 8
    logprob_std: 0.1

dataset:
  prompts:
    - "a red square"
    - "a blue square"
  repeat_per_prompt: 1

sample:
  name: full_trajectory
  batch_size: 1
  num_steps: 10
  guidance_scale: 7.5
  num_batches_per_epoch: 1

algorithm:
  name: grpo
  clip_range: 0.01
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo

rewards:
  weights:
    prompt_color: 1.0
  clients:
    prompt_color:
      name: prompt_color
      version: v1
  normalize: per_batch
  fail_policy: raise

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  max_steps: 1
  save_every: 1

trainer:
  strict_rollout_validation: true
