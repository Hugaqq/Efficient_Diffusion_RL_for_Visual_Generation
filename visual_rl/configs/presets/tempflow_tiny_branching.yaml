run_name: tempflow_tiny_branching
seed: 7
output_dir: runs/tempflow_tiny_branching

model:
  name: tiny_diffusion
  model_family: image
  extra:
    image_size: 16

dataset:
  prompts:
    - "a red square"
    - "a blue square"
  repeat_per_prompt: 1

sample:
  name: branching
  batch_size: 1
  num_steps: 4
  samples_per_prompt: 4
  num_batches_per_epoch: 1

rollout:
  branch_count: 3
  exploration_k: 2
  include_main: true
  branch_timesteps: auto
  branch_timestep_strategy: cycle

algorithm:
  name: tempflow_grpo
  clip_range: 0.01
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo
  credit_assignment: branch_timestep
  noise_weighting:
    enabled: true
    mode: std_dev_t

rewards:
  weights:
    prompt_color: 1.0
  clients:
    prompt_color:
      name: prompt_color
      version: v1
  fail_policy: raise

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.05
  max_steps: 2
  save_every: 1
