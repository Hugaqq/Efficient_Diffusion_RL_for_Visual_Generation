run_name: sd3_tempflow_reference_v1
seed: 23
use_lora: true

model:
  name: sd3_tempflow
  model_family: sd3
  extra:
    resolution: 512
    dtype: bfloat16
    lora_rank: 32
    lora_alpha: 64
    max_sequence_length: 128
    tempflow_reference_mode: true

dataset:
  prompts:
    - "a red square"
  repeat_per_prompt: 1

sample:
  name: branching
  batch_size: 1
  num_steps: 10
  guidance_scale: 4.5
  noise_level: 0.7

rollout:
  branch_count: 6
  exploration_k: 6
  include_main: false
  branch_timesteps: auto
  branch_timestep_strategy: cycle
  output_type: pt

algorithm:
  name: tempflow_grpo
  objective_version: reference_v1
  clip_range: 0.0001
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo
  advantage_epsilon: 0.0001
  advantage_dtype: float64
  params:
    preserve_advantage_dtype: true
  credit_assignment: branch_timestep
  noise_weighting:
    enabled: true
    mode: reference_std_dev_t
    scale: 2.25

optimizer:
  name: algorithm
  params:
    max_initial_logprob_delta: 0.00001
    require_initial_clipfrac_zero: true
    require_finite_gradients: true
    require_nonzero_gradients: true

rewards:
  replace_defaults: true
  weights:
    prompt_color: 1.0
  clients:
    prompt_color:
      name: prompt_color
      version: v1
  fail_policy: raise

train:
  learning_rate: 0.0003
  max_grad_norm: 1.0
  max_steps: 1
  save_every: 1

runner:
  strict_rollout_validation: true
