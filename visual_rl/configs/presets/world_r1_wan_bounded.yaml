run_name: world_r1_wan_bounded
seed: 42
use_lora: true

model:
  name: world_r1_wan_legacy
  model_family: wan
  extra:
    device: cpu
    dtype: float32
    local_files_only: true
    low_cpu_mem_usage: true
    train_cfg: true
    use_camera_trajectory: true
    lora_rank: 32
    lora_alpha: 64
    lora_target_modules:
      - to_k
      - to_out.0
      - to_q
      - to_v

dataset:
  prompts:
    - "orbit left around a small ceramic object"
    - "push in toward a toy car on a table"
  repeat_per_prompt: 1

sample:
  name: full_trajectory
  batch_size: 2
  samples_per_prompt: 2
  num_steps: 2
  guidance_scale: 4.5
  kl_reward: 0.0
  noise_level: 0.7
  sde_type: flow_sde
  diffusion_clip: false
  diffusion_clip_value: 0.45

rollout:
  frames: 3
  height: 8
  width: 8

algorithm:
  name: grpo
  clip_range: 0.001
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo
  weight_advantages: false

rewards:
  replace_defaults: true
  weights:
    reward_general: 1.0
    reward_3d: 1.0
  clients:
    reward_general:
      name: reward_general
      version: world_r1-reference-v1
      url: http://127.0.0.1:8090/
      protocol_mode: reference_v1
      wire_format: legacy_pickle
      allow_unsafe_pickle: true
      trusted_hosts:
        - 127.0.0.1
        - localhost
    reward_3d:
      name: reward_3d
      version: world_r1-reference-v1
      url: http://127.0.0.1:8089/
      protocol_mode: reference_v1
      wire_format: legacy_pickle
      allow_unsafe_pickle: true
      trusted_hosts:
        - 127.0.0.1
        - localhost
      require_camera_trajectory: true
  fail_policy: invalid

train:
  learning_rate: 0.001
  max_steps: 1
  save_every: 1

runner:
  show_progress: true
  progress_interval: 1
  strict_rollout_validation: true
