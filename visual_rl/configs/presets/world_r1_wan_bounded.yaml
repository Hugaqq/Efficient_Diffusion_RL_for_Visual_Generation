run_name: world_r1_wan_bounded
seed: 42
paths:
  output_dir: runs/world_r1_wan_bounded

model:
  name: world_r1_wan_legacy
  model_family: wan
  model_path: ""
  extra:
    repo_root: World-R1-main
    device: cpu
    dtype: float32
    local_files_only: true
    low_cpu_mem_usage: true
    train_cfg: true

dataset:
  prompts:
    - "orbit left around a small ceramic object"
    - "push in toward a toy car on a table"
  repeat_per_prompt: 1

sample:
  name: full_trajectory
  batch_size: 2
  samples_per_prompt: 2
  num_steps: 2
  guidance_scale: 4.5
  kl_reward: 0.0
  noise_level: 0.7
  sde_type: flow_sde
  diffusion_clip: false
  diffusion_clip_value: 0.45

rollout:
  frames: 3
  height: 8
  width: 8

algorithm:
  name: grpo
  clip_range: 0.001
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo
  weight_advantages: false

rewards:
  weights:
    reward_general: 1.0
    reward_3d: 1.0
  clients:
    reward_general:
      name: reward_general
      url: http://127.0.0.1:8090/
    reward_3d:
      name: reward_3d
      url: http://127.0.0.1:8089/
  fail_policy: invalid

train:
  learning_rate: 0.001
  max_steps: 1
  save_every: 1

runner:
  show_progress: true
  progress_interval: 1
  strict_rollout_validation: true
