run_name: sd3_tempflow_adapter
seed: 23
paths:
  output_dir: runs/sd3_tempflow_adapter
use_lora: true

model:
  name: sd3_tempflow
  model_family: sd3
  model_path: ""
  extra:
    repo_root: reference_code/TempFlow-GRPO-main
    resolution: 256
    dtype: bfloat16
    lora_rank: 32
    lora_alpha: 64
    max_sequence_length: 128

dataset:
  prompts:
    - "a red square"
  repeat_per_prompt: 1

sample:
  name: branching
  batch_size: 1
  num_steps: 3
  guidance_scale: 4.5

rollout:
  branch_count: 2
  exploration_k: 2
  include_main: false
  branch_timesteps: auto
  branch_timestep_strategy: cycle
  output_type: pt

algorithm:
  name: tempflow_grpo
  clip_range: 0.01
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo
  credit_assignment: branch_timestep
  noise_weighting:
    enabled: true
    mode: std_dev_t

optimizer:
  name: algorithm
  params:
    max_initial_logprob_delta: 0.00001
    require_initial_clipfrac_zero: true
    require_finite_gradients: true
    require_nonzero_gradients: true

rewards:
  weights:
    prompt_color: 1.0
  clients:
    prompt_color:
      name: prompt_color
      version: v1
  fail_policy: raise

train:
  learning_rate: 0.00001
  max_steps: 1
  save_every: 1

runner:
  strict_rollout_validation: true
