run_name: flash_wan_reference
seed: 29
use_lora: true

model:
  name: world_r1_wan_legacy
  # Runtime requirement: provide model.model_path via a profile or CLI override.
  # Provide the Flash-GRPO root via VISUAL_RL_REFERENCE_CODE_ROOT or
  # model.extra.flash_grpo_root in a profile; keep machine paths out of presets.
  model_family: wan
  extra:
    wan_backend: flash
    device: cpu
    dtype: bfloat16
    local_files_only: true
    low_cpu_mem_usage: true
    train_cfg: true
    lora_rank: 32
    lora_alpha: 64
    lora_target_modules:
      - to_k
      - to_out.0
      - to_q
      - to_v

dataset:
  prompts:
    - "a ceramic cup rotating slowly on a studio table"
  repeat_per_prompt: 1

sample:
  name: single_step
  batch_size: 1
  samples_per_prompt: 2
  num_steps: 10
  guidance_scale: 5.0
  kl_reward: 0.0

rollout:
  frames: 81
  height: 480
  width: 832
  selected_step_strategy: first
  timestep_range: [0, 9]

algorithm:
  name: flash_grpo
  objective_version: reference_v1
  clip_range: 0.001
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo

optimizer:
  name: algorithm
  params:
    require_finite_gradients: true
    require_nonzero_gradients: true

rewards:
  replace_defaults: true
  weights:
    mock: 1.0
  clients:
    mock:
      name: mock
      version: v2
  fail_policy: raise

train:
  learning_rate: 0.0003
  max_grad_norm: 1.0
  max_steps: 1
  save_every: 1

runner:
  strict_rollout_validation: true
