run_name: world_r1_wan_v02_mock
project_name: VisualRL
seed: 42
output_dir: runs/world_r1_wan_v02_mock

model:
  name: mock_wan
  model_family: wan
  latent_shape: [4, 2, 2, 2]
  media_shape: [4, 3, 16, 16]

dataset:
  prompt_fn: inline
  prompts:
    - "orbit left around a ceramic vase on a table"
    - "push in toward a red toy car"
    - "pan right across a small kitchen"
  repeat_per_prompt: 2

sample:
  name: full_trajectory
  batch_size: 2
  num_batches_per_epoch: 1
  num_steps: 2
  eval_num_steps: 2
  num_video_per_prompt: 2
  same_latent: true
  noise_level: 0.7
  sde_window_size: null
  sde_window_range: null

algorithm:
  name: grpo
  clip_range: 0.001
  adv_clip_max: 5.0
  beta: 0.0
  advantage_mode: grpo
  weight_advantages: false

rewards:
  normalize: none
  fail_policy: invalid
  weights:
    mock: 1.0
  clients:
    mock:
      name: mock
      version: v2
      mode: prompt_media

train:
  batch_size: 2
  max_steps: 2
  learning_rate: 0.001
  save_every: 1
  gradient_accumulation_steps: null

paths:
  output_dir: runs/world_r1_wan_v02_mock

