schema_version: 2
recipe: world_r1_core_v1

overrides:
  model:
    params:
      max_sequence_length: 512
  training:
    seed: 31
    global_prompt_batch_size: 2
    max_optimizer_steps: 20
    gradient_accumulation_steps: 1
    policy_recompute:
      row_microbatch_size: 1
      transition_window_size: 1
    adamw:
      learning_rate: 1.0e-4
      weight_decay: 1.0e-4
    lr_schedule:
      warmup_steps: 0
  execution:
    precision: bf16
    distribution_mode: single
    group_size: 4
    rollout:
      forward_microbatch_size: 1
      decode_microbatch_size: 1
      trajectory_storage_device: cpu

launch:
  output_dir: ../../runs/v2/world-r1-core-wan
  resume_from: null
  checkpoint_every_optimizer_steps: 10
  reward_runtime_bindings:
    reward_3d:
      execution_domain: remote
      device: cpu
      dtype: fp32
      endpoint: http://127.0.0.1:8089
      timeout_s: 1830.0
      trusted_hosts: [127.0.0.1]
      ca_bundle: null
      max_response_bytes: 8388608
    reward_general:
      execution_domain: remote
      device: cpu
      dtype: fp32
      endpoint: http://127.0.0.1:8090
      timeout_s: 1830.0
      trusted_hosts: [127.0.0.1]
      ca_bundle: null
      max_response_bytes: 8388608
  artifacts:
    model: ../../checkpoints/Wan2.1-T2V-1.3B-Diffusers
    datasets:
      main: ../../data/prompts/world_r1_camera_v1.txt
    rewards:
      reward_3d: ../../reward_artifacts/world-r1-3d-8e46b1b63498
      reward_general: ../../reward_artifacts/world-r1-general-8e46b1b63498
