schema_version: 1

run:
  seed: 29

model:
  name: wan_flash
  adapter_checkpoint: null
  params:
    checkpoint: ../checkpoints/Wan2.1-T2V-1.3B-Diffusers
    reference_repo: ../reference_code/Flash-GRPO-main
    lora_rank: 32
    lora_alpha: 64
    lora_target_modules: [to_q, to_k, to_v, to_out.0]
    gradient_checkpointing: true
    guidance_scale: 5.0
    height: 480
    width: 832
    frames: 81
    max_sequence_length: 226
    local_files_only: true
    low_cpu_mem_usage: true

dataset:
  path: ../data/prompts/geneval_rgb_train_36.txt
  prompts: null
  split: train
  repeat_per_prompt: 1
  require_unique: true
  sampling_strategy: deterministic_shuffle
  sampling_seed: 29
  empty_prompt_policy: error

rollout:
  name: single_step
  params:
    num_steps: 10
    samples_per_prompt: 4
    selected_step_strategy: iso_temporal
    timestep_range: [0, 9]

reward:
  components:
    - name: reward_general
      weight: 1.0
      params:
        url: http://127.0.0.1:8089
        timeout_s: 1830.0
        trusted_hosts: [127.0.0.1]
        ca_bundle: null
        max_response_bytes: 8388608
        server_revision: world-r1-0123456789ab
  execution:
    microbatch_size: 4
    max_retries: 1
  cache_dir: ../reward_cache/flash-wan

algorithm:
  name: flash_grpo
  params:
    clip_range: 0.001
    adv_clip_max: 5.0
  advantage:
    epsilon: 1.0e-6

optimizer:
  learning_rate: 3.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  max_initial_logprob_delta: 1.0e-4
  require_initial_clipfrac_zero: true
  require_finite_gradients: true
  require_nonzero_gradients: true

runtime:
  max_steps: 20
  batch_size: 2
  precision: bf16
  update_microbatch_size: 4
  deterministic: true
  progress: true
  distributed:
    mode: single
    device: cuda
    timeout_s: 300.0
    max_snapshot_tensor_bytes: null

artifacts:
  output_dir: ../runs/flash-wan
  checkpoint_every: 10
  checkpoint_keep_last: 1
  preview_samples_per_event: 2

resume:
  from: null
