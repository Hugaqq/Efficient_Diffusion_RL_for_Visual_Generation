[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-rl"
version = "0.6.0"
description = "Unified Diffusion RL infrastructure for visual generation."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<2.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "torch>=2.6",
  "torchvision>=0.21",
  "accelerate>=1.4",
  "diffusers>=0.33",
  "transformers>=4.40",
  "peft>=0.10",
  "ml-collections>=0.1",
  "wandb>=0.18",
  "requests>=2.32",
  "pillow>=10",
  "imageio>=2.34",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.8",
]

[project.scripts]
visual-rl = "visual_rl.cli:main"

[tool.setuptools.packages.find]
include = ["visual_rl*"]

[tool.setuptools.package-data]
"visual_rl.configs.presets" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference_code", "third_party", ".git", ".venv", "runs"]
markers = [
  "distributed: tests requiring local multi-process torch.distributed loopback sockets",
]
